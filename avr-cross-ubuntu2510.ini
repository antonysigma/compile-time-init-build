[constants]
avr_prefix = '/usr'
avr_toolchain_bin = avr_prefix / 'bin'
avr_toolchain_prefix = avr_toolchain_bin / 'avr-'
avr_specs = avr_prefix / 'lib/gcc/avr/14.2.0/device-specs/specs-atmega328p'
f_cpu = '16000000L'

compile_args = [
    '-mmcu=atmega328p',
    '-specs=' + avr_specs,
    '-DF_CPU=' + f_cpu]

[binaries]
c = ['ccache', avr_toolchain_prefix + 'gcc']

cpp = ['ccache', avr_toolchain_prefix + 'g++']

#ar = avr_toolchain_prefix + 'ar'
ranlib = avr_toolchain_prefix + 'ranlib'
strip = avr_toolchain_prefix + 'strip'

[built-in options]
cpp_args = compile_args
c_args = compile_args
b_staticpic = false

[host_machine]
system = 'avr'
cpu_family = 'avr'
cpu = 'avr'
endian = 'little'

[properties]
variant = 'standard'
